<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A1633">
  <title>Mandoob+ — منصة المهام داخل المدينة</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مندوب بلس">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="offline" class="offline-banner" hidden>لا يوجد اتصال بالإنترنت — ستتم المزامنة تلقائيًا عند عودته</div>
  <div id="app" aria-live="polite"></div>
  <nav id="tabs" class="tabs" hidden aria-label="التنقل الرئيسي"></nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>

  <!-- تسجيل الـ Service Worker (يعمل على HTTPS أو localhost) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((err) => console.error("SW registration failed:", err));
      });
    }
  </script>
</body>
</html>
